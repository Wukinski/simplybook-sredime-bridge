# Pilot HTTPS on an IP address. Replace __PUBLIC_IP__ after host verification.
# Certbot >=5.4, Let's Encrypt shortlived profile; renew automatically.
server {
    listen 80;
    server_name __PUBLIC_IP__;
    access_log off;
    error_log /var/log/nginx/booking-bridge-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/booking-bridge-acme;
        default_type text/plain;
    }
    location / { return 404; }
}

# TLS certificate must exist before enabling this server block.
server {
    listen 443 ssl;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/booking-bridge-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking-bridge-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/booking-bridge-error.log crit;
    client_max_body_size 128k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;

    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /sredime/webhook { proxy_pass http://127.0.0.1:8000; }
    location = /simplybook/webhook { proxy_pass http://127.0.0.1:8000; }
    location = /health/live { proxy_pass http://127.0.0.1:8000; }
    location /ics/ { proxy_pass http://127.0.0.1:8000; }
    # Administration and readiness remain reachable only through SSH/VPN.
    location / { return 404; }
}
