# Run from a separate host deployment directory with reviewed private inputs.
# The config is simulation until the real callback/contact checks pass.
name: booking-bridge-pilot
services:
  api:
    image: andjelija-bridge:pilot-20261027-integration1
    restart: on-failure:5
    environment:
      BRIDGE_ENV_FILE: /run/secrets/bridge_env
      BRIDGE_STATE: /state
    secrets: [bridge_env]
    volumes:
      - bridge_state:/state
      - ./controlled-pilot-config.json:/app/booking_bridge/config.local.json:ro
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    image: andjelija-bridge:pilot-20261027-integration1
    command: ["python", "-m", "booking_bridge.pilot_receiver"]
    restart: on-failure:5
    environment:
      BRIDGE_ENV_FILE: /run/secrets/bridge_env
      BRIDGE_STATE: /state
    secrets: [bridge_env]
    volumes:
      - bridge_state:/state
      - provider_state:/app/provider_assignment/state
      - ./controlled-pilot-config.json:/app/booking_bridge/config.local.json:ro
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  bridge_state:
  provider_state:
secrets:
  bridge_env:
    file: ./pilot.env
